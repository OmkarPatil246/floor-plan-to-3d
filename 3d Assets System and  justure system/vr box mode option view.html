<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Simple Three.js VR Box Ground</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101820;font-family:Arial,sans-serif;color:#fff;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  #view{display:block;width:100%;height:100%;touch-action:none}
  #hud{position:fixed;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:16px;box-sizing:border-box}
  #top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .panel{background:#101820cc;border:1px solid #ffffff30;border-radius:12px;padding:10px 12px;max-width:60%;font-size:13px;line-height:1.4}
  button{pointer-events:auto;border:0;border-radius:12px;padding:12px 15px;background:#28a9ff;color:#061521;font-weight:700;font-size:14px;cursor:pointer;box-shadow:0 4px 16px #0005;touch-action:none;-webkit-tap-highlight-color:transparent}
  button.alt{background:#ffffffdd}
  #topBtns{display:flex;flex-direction:column;gap:8px;align-items:flex-end}
  #bottom{display:flex;justify-content:center;align-items:flex-end;gap:10px;flex-wrap:wrap}
  #status,#diag{width:100%;font-size:12px;opacity:.9;text-align:center}
  #reticle{position:fixed;left:50%;top:50%;width:8px;height:8px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;opacity:.7}
  body.vr #hud,body.vr #reticle{display:none}
</style>
</head>
<body>
<canvas id="view"></canvas>
<div id="reticle"></div>
<div id="hud">
  <div id="top">
    <div class="panel"><b>3D Ground Demo</b><br>Tap “Enter VR”, then slide the phone into your VR box. Look with your head and <b>walk on the spot</b> to move where you look (touching the screen also walks).<br>
      <label style="pointer-events:auto;display:block;margin-top:6px">Movement<br><select id="mode" style="width:100%;padding:6px;border-radius:8px"><option value="hybrid">Hybrid: steps + GPS (best)</option><option value="steps">Walk in place (steps only)</option><option value="gps-look">GPS speed, go where I look</option><option value="gps-true">GPS real map (uses compass)</option><option value="manual">Buttons / touch only</option></select></label>
      <label style="pointer-events:auto;display:block;margin-top:6px">Step trigger (lower = more sensitive)<br><input id="sens" type="range" min="0.3" max="3" step="0.1" value="1.2" style="width:100%"></label></div>
    <div id="topBtns">
      <button id="arvr">Enter VR</button>
      <button id="recenter" class="alt">Recenter</button>
    </div>
  </div>
  <div id="bottom">
    <button id="forward">▲ Forward</button><button id="left">◀ Left</button><button id="back">▼ Back</button><button id="right">Right ▶</button>
    <div id="status">Loading VR support…</div>
    <div id="diag"></div>
  </div>
</div>

<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const canvas = document.querySelector('#view');
const statusEl = document.querySelector('#status');
const arvrBtn = document.querySelector('#arvr');
const recenterBtn = document.querySelector('#recenter');

/* ------------------------------------------------------------------
   Standard VR support:
   - Browsers with native WebXR VR (headsets) use it directly.
   - Phones without it (Chrome/Safari on a phone) get the official
     immersive-web "webxr-polyfill", which provides the real Cardboard
     VR box view: two lens-distorted eye views, viewer profiles, the
     settings (gear) button, head tracking and a back button.
------------------------------------------------------------------- */
function loadScript(src){
  return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('Could not load '+src));document.head.appendChild(s);});
}
async function setupXR(){
  try{
    let native=false;
    if(navigator.xr){ try{ native=await navigator.xr.isSessionSupported('immersive-vr'); }catch(e){} }
    if(native) return;
    // Let the polyfill install its full Cardboard implementation instead of the phone's AR-only navigator.xr
    if('xr' in navigator){ try{ delete Navigator.prototype.xr; }catch(e){} try{ delete navigator.xr; }catch(e){} }
    // Remove the browser's native XR classes too, so the polyfill installs a complete, matching set
    // (this is what the "XRSession already defined on global" warnings were about)
    for(const name of Object.getOwnPropertyNames(window)){
      if(/^XR[A-Z]/.test(name)){ try{ delete window[name]; }catch(e){} }
    }
    await loadScript('https://cdn.jsdelivr.net/npm/webxr-polyfill@latest/build/webxr-polyfill.min.js');
    if(window.WebXRPolyfill) new window.WebXRPolyfill({cardboard:true});
  }catch(err){ console.warn('XR setup:',err); }
}
const xrReady = setupXR().then(async()=>{
  let ok=false;
  try{ ok=!!(navigator.xr && await navigator.xr.isSessionSupported('immersive-vr')); }catch(e){}
  statusEl.textContent = ok
    ? 'Ready · tap “Enter VR”, then put the phone in your VR box.'
    : 'VR is not available here. Open this page on a phone over HTTPS or localhost.';
  return ok;
});

/* ---------------- Scene ---------------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9bc8e8);
scene.fog = new THREE.Fog(0x9bc8e8, 22, 90);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.05, 250);
// Camera lives in a rig so the player can "walk" (the headset pose is relative to the rig)
const rig = new THREE.Group();
rig.add(camera);
scene.add(rig);

const renderer = new THREE.WebGLRenderer({canvas, antialias:true, alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight, false);
renderer.xr.enabled = true;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;

scene.add(new THREE.HemisphereLight(0xffffff, 0x536477, 2.0));
const sun = new THREE.DirectionalLight(0xffffff, 2.0);
sun.position.set(-8, 14, 7); sun.castShadow = true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-30;sun.shadow.camera.right=30;sun.shadow.camera.top=30;sun.shadow.camera.bottom=-30;
sun.shadow.camera.far=60;
scene.add(sun);

const ground = new THREE.Mesh(new THREE.PlaneGeometry(200,200), new THREE.MeshStandardMaterial({color:0x557d53, roughness:1}));
ground.rotation.x = -Math.PI/2; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(100,100,0xffffff,0xffffff);
grid.position.y = 0.012; grid.material.transparent = true; grid.material.opacity = 0.16; scene.add(grid);

// Low-poly player (front faces -Z)
const player = new THREE.Group();
const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.32,0.65,4,8), new THREE.MeshStandardMaterial({color:0x2478ff, roughness:.7}));
body.position.y = 0.82; body.castShadow = true; player.add(body);
const head = new THREE.Mesh(new THREE.SphereGeometry(0.24,16,12), new THREE.MeshStandardMaterial({color:0xffc89b, roughness:.8}));
head.position.y = 1.48; head.castShadow = true; player.add(head);
const face = new THREE.Mesh(new THREE.BoxGeometry(.18,.08,.05), new THREE.MeshStandardMaterial({color:0x18202b}));
face.position.set(0,1.49,-0.22); player.add(face);
scene.add(player);

const matA = new THREE.MeshStandardMaterial({color:0xd9e3e8, roughness:.9});
const matB = new THREE.MeshStandardMaterial({color:0xe0a64b, roughness:.85});
function box(x,y,z,sx,sy,sz,mat){const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;scene.add(m);return m;}
for(let i=-3;i<=3;i++){
  if(i===0) continue;
  box(i*3,.5,-8,1,1,1, i%2?matA:matB);
  box(i*3,.5,8,1,1,1, i%2?matB:matA);
}
for(const [x,z] of [[-7,-5],[7,-4],[-7,5],[7,6]]){
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(.12,.16,1.3,7),new THREE.MeshStandardMaterial({color:0x795436}));trunk.position.set(x,.65,z);trunk.castShadow=true;scene.add(trunk);
  const crown=new THREE.Mesh(new THREE.ConeGeometry(.85,1.8,7),new THREE.MeshStandardMaterial({color:0x236b42,roughness:1}));crown.position.set(x,1.9,z);crown.castShadow=true;scene.add(crown);
}

/* ---- a bit more surrounding: path, scattered trees and rocks, flowers, clouds, sun ---- */
let _s=7; const rand=()=>{_s=(_s*16807)%2147483647;return _s/2147483647;};   // fixed seed = same world every time
const dirt=new THREE.Mesh(new THREE.PlaneGeometry(2.4,140),new THREE.MeshStandardMaterial({color:0xb59b72,roughness:1}));
dirt.rotation.x=-Math.PI/2; dirt.position.set(0,0.02,0); dirt.receiveShadow=true; scene.add(dirt);

const trunkG=new THREE.CylinderGeometry(.12,.16,1.3,7), crownG=new THREE.ConeGeometry(.85,1.8,7), crownG2=new THREE.ConeGeometry(.6,1.4,7);
const trunkM=new THREE.MeshStandardMaterial({color:0x795436}), greens=[0x236b42,0x2e7d4f,0x1f5c3a].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:1}));
const rockG=new THREE.DodecahedronGeometry(.45,0), rockM=new THREE.MeshStandardMaterial({color:0x8a9096,roughness:.95,flatShading:true});
const flowerG=new THREE.SphereGeometry(.07,6,5), flowerMs=[0xffd23f,0xff6b6b,0xffffff,0xc77dff].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.8}));
function farEnough(x,z){ return Math.hypot(x,z)>5 && Math.abs(x)>2.2; }   // keep the centre and path clear
for(let i=0;i<46;i++){
  const x=(rand()-.5)*120, z=(rand()-.5)*120; if(!farEnough(x,z)) continue;
  const k=.8+rand()*.8, near=Math.hypot(x,z)<28;
  const tr=new THREE.Mesh(trunkG,trunkM); tr.scale.setScalar(k); tr.position.set(x,.65*k,z); tr.castShadow=near; scene.add(tr);
  const cr=new THREE.Mesh(crownG,greens[i%3]); cr.scale.setScalar(k); cr.position.set(x,1.9*k,z); cr.castShadow=near; scene.add(cr);
  const cr2=new THREE.Mesh(crownG2,greens[i%3]); cr2.scale.setScalar(k); cr2.position.set(x,2.7*k,z); cr2.castShadow=near; scene.add(cr2);
}
for(let i=0;i<18;i++){
  const x=(rand()-.5)*90, z=(rand()-.5)*90; if(!farEnough(x,z)) continue;
  const r=new THREE.Mesh(rockG,rockM); r.scale.set(.6+rand()*1.2,.5+rand()*.7,.6+rand()*1.2); r.position.set(x,.2,z); r.rotation.set(rand()*3,rand()*3,rand()*3); r.castShadow=true; r.receiveShadow=true; scene.add(r);
}
for(let i=0;i<90;i++){
  const x=(rand()-.5)*50, z=(rand()-.5)*50; if(!farEnough(x,z)) continue;
  const f=new THREE.Mesh(flowerG,flowerMs[i%4]); f.position.set(x,.1,z); scene.add(f);
}
// low-poly clouds that drift slowly
const clouds=new THREE.Group(), cloudM=new THREE.MeshStandardMaterial({color:0xffffff,roughness:1,emissive:0xffffff,emissiveIntensity:.35,fog:false});
for(let i=0;i<9;i++){
  const c=new THREE.Group(), n=3+Math.floor(rand()*3);
  for(let j=0;j<n;j++){ const p=new THREE.Mesh(new THREE.SphereGeometry(2+rand()*1.8,8,6),cloudM); p.position.set(j*2.6-n*1.3,rand()*.8,rand()*1.6); p.scale.y=.6; c.add(p); }
  const a=rand()*Math.PI*2, d=60+rand()*40; c.position.set(Math.cos(a)*d,28+rand()*10,Math.sin(a)*d);
  clouds.add(c);
}
scene.add(clouds);
const sunBall=new THREE.Mesh(new THREE.SphereGeometry(5,16,12),new THREE.MeshBasicMaterial({color:0xfff2b0,fog:false}));
sunBall.position.set(-60,75,50); scene.add(sunBall);

/* ---------------- Normal (non-VR) look: phone gyro or drag ---------------- */
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const D2R=Math.PI/180;
const CHASE_DIST=3.2;
let gyroEnabled=false, gotGyroData=false, needCalibrate=true, headingOffset=0, userYaw=0, yaw=0, pitch=0, devHasData=false;
const devTarget=new THREE.Quaternion(), devSmooth=new THREE.Quaternion(), lookQ=new THREE.Quaternion();
const _euler=new THREE.Euler(), _q0=new THREE.Quaternion(), _q1=new THREE.Quaternion(-Math.sqrt(.5),0,0,Math.sqrt(.5));
const ZEE=new THREE.Vector3(0,0,1), UP=new THREE.Vector3(0,1,0), _v=new THREE.Vector3(), _dir=new THREE.Vector3();

function screenAngle(){
  const a=(screen.orientation&&typeof screen.orientation.angle==='number')?screen.orientation.angle:(typeof window.orientation==='number'?window.orientation:0);
  return a*D2R;
}
function deviceToQuat(out,alpha,beta,gamma,orient){
  _euler.set(beta,alpha,-gamma,'YXZ'); out.setFromEuler(_euler);
  out.multiply(_q1); out.multiply(_q0.setFromAxisAngle(ZEE,-orient)); return out;
}
function yawOf(q){
  _v.set(0,0,-1).applyQuaternion(q);
  if(Math.hypot(_v.x,_v.z)<0.05){ _v.set(0,1,0).applyQuaternion(q); return Math.atan2(_v.x,_v.z); }
  return Math.atan2(-_v.x,-_v.z);
}
function onOrientation(e){
  if(!gyroEnabled||e.alpha==null||e.beta==null||e.gamma==null) return;
  if(typeof e.webkitCompassHeading==='number'&&e.webkitCompassHeading>=0) setCompass(360-e.webkitCompassHeading,e.beta,e.gamma);  // iOS compass
  deviceToQuat(devTarget,e.alpha*D2R,e.beta*D2R,e.gamma*D2R,screenAngle());
  if(!devHasData){devSmooth.copy(devTarget);devHasData=true;}
  gotGyroData=true;
}
async function enableGyro(){   // asks iOS for motion permission (must run inside a tap) and starts sensors
  try{
    const reqs=[];   // both requests are started together, inside the same tap
    if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function') reqs.push(DeviceOrientationEvent.requestPermission());
    if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function') reqs.push(DeviceMotionEvent.requestPermission());
    const res=await Promise.all(reqs);
    if(res.some(r=>r!=='granted')) return false;
    if(!gyroEnabled&&'DeviceOrientationEvent' in window){
      gyroEnabled=true; window.addEventListener('deviceorientation',onOrientation,true);
      window.addEventListener('deviceorientationabsolute',onAbsOrientation,true);   // Android compass
    }
    if(!motionEnabled&&'DeviceMotionEvent' in window){
      motionEnabled=true; window.addEventListener('devicemotion',onMotion,true);
    }
    return true;
  }catch(e){ return false; }
}

/* ================= Movement engine =================
   1) Steps / PDR : accelerometer peak detection (min step gap 0.3 s, peak height max(slider, 0.8σ),
                    regular-cadence check, head-whip rejection with the gyro) and the Weinberg
                    step-length model  L = K·(aMax−aMin)^¼  → smooth walking speed.
   2) GPS         : Geolocation fixes → local East/North metres → 2-state Kalman filter per axis
                    (position + velocity; Doppler speed/heading used when the phone reports them).
   3) Hybrid      : steps give instant, smooth motion; GPS measures the real distance walked and keeps
                    correcting the stride constant K; GPS alone drives you if no steps are detected.
   4) GPS real map: real East/North movement is applied to the world directly (−Z = north) and the
                    compass keeps the world rotated correctly. */
const modeSel=document.getElementById('mode'), diagEl=document.getElementById('diag');
try{ const m=localStorage.getItem('moveMode'); if(m&&modeSel) modeSel.value=m; }catch(e){}
modeSel&&modeSel.addEventListener('change',()=>{ try{localStorage.setItem('moveMode',modeSel.value);}catch(e){} needCalibrate=true; calStart=null; });
const getMode=()=>modeSel?modeSel.value:'hybrid';
const wrapPi=a=>Math.atan2(Math.sin(a),Math.cos(a));
const approach=(c,t,s)=>c<t?Math.min(c+s,t):Math.max(c-s,t);

/* ---- compass (absolute heading of where you look) ---- */
let compassSin=0, compassCos=1, compassOK=false;
const absQ=new THREE.Quaternion();
function setCompass(alphaDeg,beta,gamma){
  deviceToQuat(absQ,alphaDeg*D2R,beta*D2R,gamma*D2R,screenAngle());
  const b=-yawOf(absQ);                       // clockwise from north, radians
  if(!compassOK){compassSin=Math.sin(b);compassCos=Math.cos(b);compassOK=true;}
  else{compassSin+=(Math.sin(b)-compassSin)*0.15;compassCos+=(Math.cos(b)-compassCos)*0.15;}
}
const compassBearing=()=>Math.atan2(compassSin,compassCos);
function onAbsOrientation(e){ if(e.alpha==null||e.beta==null||e.gamma==null||e.absolute===false) return; setCompass(e.alpha,e.beta,e.gamma); }

/* ---- 1) steps (pedestrian dead reckoning) ---- */
let motionEnabled=false, stepCount=0, lastStepT=0, lastStepAt=-1e9, cadenceOK=0;
let baseline=9.8, lp=0, prev1=0, prev2=0, varAcc=0.5, winMax=0, winMin=0, rotLP=0;
let emaSpeed=0, pdrSpeedCur=0, lastStepLen=0.7, pdrWindowDist=0;
let strideK=0.62;   // Weinberg gain, learned from GPS in hybrid mode
try{ const k=parseFloat(localStorage.getItem('strideK')); if(k>0.2&&k<1.6) strideK=k; }catch(e){}
const sens=document.getElementById('sens');
try{ const s=localStorage.getItem('stepThr'); if(s&&sens) sens.value=s; }catch(e){}
sens&&sens.addEventListener('input',()=>{ try{localStorage.setItem('stepThr',sens.value);}catch(e){} });

function onMotion(e){
  const a=e.accelerationIncludingGravity; if(!a||a.x==null) return;
  const t=performance.now();
  const m=Math.hypot(a.x,a.y,a.z);               // magnitude: independent of how the phone is turned
  baseline+=(m-baseline)*0.01;                   // slow average = gravity
  lp+=((m-baseline)-lp)*0.35;                    // low-pass keeps the 1-3 Hz step bounce
  varAcc+=(lp*lp-varAcc)*0.01;
  const r=e.rotationRate; if(r){ const w=Math.hypot(r.alpha||0,r.beta||0,r.gamma||0); rotLP+=(w-rotLP)*0.2; }
  if(lp>winMax) winMax=lp; if(lp<winMin) winMin=lp;
  if(prev1>prev2 && prev1>=lp){                  // local maximum = foot strike
    const thr=Math.max(parseFloat(sens?sens.value:1.0),0.8*Math.sqrt(varAcc));
    if(prev1>thr && t-lastStepT>300 && rotLP<250) registerStep(t,winMax-winMin);
  }
  prev2=prev1; prev1=lp;
}
function registerStep(t,pp){
  const dtStep=(t-lastStepT)/1000; lastStepT=t; winMax=winMin=lp;
  cadenceOK=dtStep<1.1?Math.min(cadenceOK+1,3):0;
  if(cadenceOK<1||pp<0.5) return;                // first step only arms the detector
  const len=clamp(strideK*Math.pow(pp,0.25),0.3,1.1);     // Weinberg step length
  const inst=len/clamp(dtStep,0.3,1.1);
  emaSpeed=emaSpeed>0?emaSpeed*0.6+inst*0.4:inst;
  lastStepLen=len; lastStepAt=t; stepCount++;
}

/* ---- 2) GPS + Kalman filter ---- */
class K2{ // state [position, velocity] along one axis
  constructor(){this.x0=0;this.x1=0;this.P00=1e4;this.P01=0;this.P10=0;this.P11=100;}
  reset(p,acc){this.x0=p;this.x1=0;this.P00=acc*acc;this.P01=this.P10=0;this.P11=4;}
  predict(dt,q){
    this.x0+=this.x1*dt;
    const {P00,P01,P10,P11}=this;
    this.P00=P00+dt*(P01+P10)+dt*dt*P11+q*dt**4/4;
    this.P01=P01+dt*P11+q*dt**3/2;
    this.P10=P10+dt*P11+q*dt**3/2;
    this.P11=P11+q*dt*dt;
  }
  update(h0,h1,z,R){
    const y=z-(h0*this.x0+h1*this.x1);
    const a=this.P00*h0+this.P01*h1, b=this.P10*h0+this.P11*h1;
    const S=h0*a+h1*b+R, k0=a/S, k1=b/S;
    this.x0+=k0*y; this.x1+=k1*y;
    const hp0=h0*this.P00+h1*this.P10, hp1=h0*this.P01+h1*this.P11;
    this.P00-=k0*hp0; this.P01-=k0*hp1; this.P10-=k1*hp0; this.P11-=k1*hp1;
  }
}
const kE=new K2(), kN=new K2();
const GPS={watch:null,lat0:null,lon0:null,cos:1,t:0,acc:null,err:null,fixes:0,lastFix:0,vE:0,vN:0,speed:0,moving:false};
let calStart=null;

function startGps(){
  if(GPS.watch!==null) return;
  if(!('geolocation' in navigator)){ GPS.err='not supported'; return; }
  GPS.watch=navigator.geolocation.watchPosition(onGps,err=>{GPS.err=err.code===1?'permission denied':(err.message||'error');},
    {enableHighAccuracy:true,maximumAge:0,timeout:20000});
}
function onGps(pos){
  const c=pos.coords; GPS.acc=c.accuracy; GPS.err=null; GPS.fixes++;
  if(c.accuracy>35) return;                      // too poor to use
  const t=pos.timestamp/1000;
  if(GPS.lat0===null){
    GPS.lat0=c.latitude; GPS.lon0=c.longitude; GPS.cos=Math.cos(c.latitude*D2R);
    kE.reset(0,c.accuracy); kN.reset(0,c.accuracy); GPS.t=t; GPS.lastFix=performance.now(); return;
  }
  const E=(c.longitude-GPS.lon0)*GPS.cos*111320, N=(c.latitude-GPS.lat0)*110574;   // metres east / north of the first fix
  const dtF=clamp(t-GPS.t,0.05,5); GPS.t=t;
  kE.predict(dtF,1.0); kN.predict(dtF,1.0);
  const R=Math.max(c.accuracy,3)**2;
  kE.update(1,0,E,R); kN.update(1,0,N,R);
  if(typeof c.speed==='number'&&!isNaN(c.speed)){        // Doppler velocity (more accurate than position changes)
    if(c.speed<0.3||typeof c.heading!=='number'||isNaN(c.heading)){ kE.update(0,1,0,0.16); kN.update(0,1,0,0.16); }
    else{ const h=c.heading*D2R; kE.update(0,1,c.speed*Math.sin(h),0.49); kN.update(0,1,c.speed*Math.cos(h),0.49); }
  }
  GPS.lastFix=performance.now();
  calibrateStride();
}
function gpsRefresh(){
  const age=(performance.now()-GPS.lastFix)/1000;
  const fade=age>3?Math.exp(-(age-3)/1.5):1;             // fade out if fixes stop arriving
  GPS.vE=kE.x1*fade; GPS.vN=kN.x1*fade; GPS.speed=Math.hypot(GPS.vE,GPS.vN);
  GPS.moving=GPS.moving?GPS.speed>0.4:GPS.speed>0.7;     // hysteresis: ignores standing-still jitter
}

/* ---- 3) hybrid: GPS teaches the step length ---- */
function calibrateStride(){
  if(getMode()!=='hybrid'){calStart=null;return;}
  const now=performance.now()/1000;
  if(!calStart){calStart={E:kE.x0,N:kN.x0,t:now};pdrWindowDist=0;return;}
  if(now-calStart.t<8) return;
  const gd=Math.hypot(kE.x0-calStart.E,kN.x0-calStart.N);
  if(GPS.acc<=15&&pdrWindowDist>6&&gd>4){                // walked for real along a fairly straight line
    const ratio=gd/pdrWindowDist;
    if(ratio>0.5&&ratio<2){ strideK=clamp(strideK*(1+0.35*(ratio-1)),0.25,1.5); try{localStorage.setItem('strideK',strideK.toFixed(3));}catch(e){} }
  }
  calStart=null;
}

/* ---- movement per frame ---- */
let gpsSpeedCur=0;
function move(dt){
  const mode=getMode(), t=performance.now();
  gpsRefresh();
  let dx=0, dz=0;
  // buttons / touch / keyboard always work
  const f=(keys.forward?1:0)-(keys.back?1:0), s=(keys.right?1:0)-(keys.left?1:0);
  if(f||s){ const sp=3.2*dt/Math.hypot(f,s); dx+=(-Math.sin(facingYaw)*f+Math.cos(facingYaw)*s)*sp; dz+=(-Math.cos(facingYaw)*f-Math.sin(facingYaw)*s)*sp; }
  // steps (smooth ramp up / down)
  const stepsRecent=(t-lastStepAt)<900;
  const usePdr=mode==='steps'||mode==='hybrid';
  pdrSpeedCur=approach(pdrSpeedCur,(usePdr&&stepsRecent)?emaSpeed:0,5*dt);
  pdrWindowDist+=pdrSpeedCur*dt;
  // GPS speed, applied along the look direction
  const trueMap=mode==='gps-true'&&compassOK;
  const gpsLook=mode==='gps-look'||(mode==='gps-true'&&!compassOK)||(mode==='hybrid'&&!stepsRecent&&pdrSpeedCur<0.1);
  gpsSpeedCur=approach(gpsSpeedCur,(gpsLook&&GPS.moving)?GPS.speed:0,3*dt);
  const fwd=pdrSpeedCur+gpsSpeedCur;
  dx+=-Math.sin(facingYaw)*fwd*dt; dz+=-Math.cos(facingYaw)*fwd*dt;
  // real-map: world is north-aligned (−Z = north, +X = east)
  if(trueMap&&GPS.moving){ dx+=GPS.vE*dt; dz+=-GPS.vN*dt; }
  player.position.x=clamp(player.position.x+dx,-90,90);
  player.position.z=clamp(player.position.z+dz,-90,90);
}

setInterval(()=>{
  if(!diagEl||renderer.xr.isPresenting) return;
  const g=GPS.err?'GPS: '+GPS.err:(GPS.acc==null?'GPS: waiting for fix':'GPS ±'+GPS.acc.toFixed(0)+' m, '+GPS.speed.toFixed(1)+' m/s');
  diagEl.textContent=g+' · steps '+stepCount+' · stride '+lastStepLen.toFixed(2)+' m (K '+strideK.toFixed(2)+') · compass '+(compassOK?'ok':'n/a');
},500);

function computeLook(){
  if(gyroEnabled&&devHasData){
    devSmooth.slerp(devTarget,0.65);
    const north=getMode()==='gps-true'&&compassOK;
    if(needCalibrate){headingOffset=north?-compassBearing()-yawOf(devSmooth):-yawOf(devSmooth);userYaw=0;needCalibrate=false;}
    else if(north){ userYaw=0; headingOffset+=wrapPi(-compassBearing()-(yawOf(devSmooth)+headingOffset))*0.02; }
    _q0.setFromAxisAngle(UP,headingOffset+userYaw);
    lookQ.copy(_q0).multiply(devSmooth);
  } else {
    _euler.set(pitch,yaw,0,'YXZ'); lookQ.setFromEuler(_euler);
  }
}

let dragging=false,lastX=0,lastY=0;
canvas.addEventListener('pointerdown',e=>{if(renderer.xr.isPresenting)return;dragging=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture?.(e.pointerId);});
canvas.addEventListener('pointermove',e=>{
  if(!dragging||renderer.xr.isPresenting)return;
  const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;
  if(gyroEnabled&&devHasData){userYaw-=dx*.004;} else {yaw-=dx*.004;pitch=clamp(pitch-dy*.004,-1.25,1.25);}
});
const endDrag=()=>{dragging=false;};
canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);
canvas.addEventListener('contextmenu',e=>e.preventDefault());
recenterBtn.addEventListener('click',()=>{needCalibrate=true;yaw=0;pitch=0;});

/* ---------------- Movement ---------------- */
const keys={forward:false,back:false,left:false,right:false};
function bindMove(id,key){
  const el=document.getElementById(id);
  const start=e=>{e.preventDefault();keys[key]=true;};
  const stop=e=>{e.preventDefault();keys[key]=false;};
  el.addEventListener('pointerdown',start);
  ['pointerup','pointercancel','pointerleave'].forEach(n=>el.addEventListener(n,stop));
}
bindMove('forward','forward');bindMove('back','back');bindMove('left','left');bindMove('right','right');
const keyMap={w:'forward',ArrowUp:'forward',s:'back',ArrowDown:'back',a:'left',ArrowLeft:'left',d:'right',ArrowRight:'right'};
window.addEventListener('keydown',e=>{const k=keyMap[e.key];if(k)keys[k]=true;});
window.addEventListener('keyup',e=>{const k=keyMap[e.key];if(k)keys[k]=false;});
window.addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});

let facingYaw=0;

/* ---------------- Enter / exit VR (standard WebXR) ---------------- */
let rigY=0, checkedHeight=false;
arvrBtn.addEventListener('click',async()=>{
  if(renderer.xr.isPresenting){ await renderer.xr.getSession()?.end(); return; }
  startGps();                         // GPS permission prompt
  await enableGyro();                 // motion permission for iOS + normal-view look
  const ok=await xrReady;
  if(!ok){ statusEl.textContent='VR is not available in this browser. Use a phone over HTTPS or localhost.'; return; }
  try{
    const session=await navigator.xr.requestSession('immersive-vr',{optionalFeatures:['local-floor','bounded-floor']});
    session.addEventListener('selectstart',()=>{keys.forward=true;});   // touch / trigger = walk where you look
    session.addEventListener('selectend',()=>{keys.forward=false;});
    checkedHeight=false; rigY=0;
    await renderer.xr.setSession(session);
  }catch(err){ statusEl.textContent='Could not start VR: '+(err.message||err); }
});
// Fallback for VR boxes where the XR "select" event does not fire: touching the screen also walks forward
window.addEventListener('touchstart',()=>{if(renderer.xr.isPresenting)keys.forward=true;},{passive:true});
window.addEventListener('touchend',()=>{if(renderer.xr.isPresenting)keys.forward=false;},{passive:true});
window.addEventListener('touchcancel',()=>{if(renderer.xr.isPresenting)keys.forward=false;},{passive:true});
renderer.xr.addEventListener('sessionstart',()=>{document.body.classList.add('vr');arvrBtn.textContent='Exit VR';});
renderer.xr.addEventListener('sessionend',()=>{
  document.body.classList.remove('vr');arvrBtn.textContent='Enter VR';
  keys.forward=false; camera.position.set(0,0,0); camera.quaternion.identity(); rig.position.y=0;
  needCalibrate=true;
  statusEl.textContent='VR ended. Tap “Enter VR” to go back in.';
});

/* ---------------- Main loop ---------------- */
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),.05);
  clouds.rotation.y+=dt*0.004;

  if(renderer.xr.isPresenting){
    // First-person: heading comes from the real head pose; the XR system draws both eyes with lens distortion
    const xrCam=renderer.xr.getCamera();
    xrCam.getWorldDirection(_dir);
    if(Math.hypot(_dir.x,_dir.z)>0.05) facingYaw=Math.atan2(-_dir.x,-_dir.z);
    // real-map mode: turn the world (rig) so that -Z = north, using the compass
    if(getMode()==='gps-true'&&compassOK){
      const local=facingYaw-rig.rotation.y;
      rig.rotation.y+=wrapPi(wrapPi(-compassBearing()-local)-rig.rotation.y)*0.04;
    } else rig.rotation.y=0;
    if(!checkedHeight){ // if the device reports a pose at ground level, lift the rig to eye height
      xrCam.getWorldPosition(_v);
      if(xrCam.cameras&&xrCam.cameras.length){ checkedHeight=true; rigY=(_v.y-rig.position.y)<0.8?1.6:0; }
    }
    move(dt);
    player.visible=false;
    player.rotation.y=facingYaw;
    rig.position.set(player.position.x,rigY,player.position.z);
    renderer.render(scene,camera);
    return;
  }

  // Normal view: third-person, look with phone gyro or drag
  computeLook();
  facingYaw=yawOf(lookQ);
  rig.rotation.y=0;
  move(dt);
  player.visible=true;
  player.rotation.y=facingYaw;
  camera.quaternion.copy(lookQ);
  _dir.set(0,0,-1).applyQuaternion(lookQ);
  rig.position.set(player.position.x,0,player.position.z);
  camera.position.set(-_dir.x*CHASE_DIST,Math.max(1.35-_dir.y*CHASE_DIST,0.25),-_dir.z*CHASE_DIST);
  renderer.render(scene,camera);
});

function onResize(){
  if(renderer.xr.isPresenting) return;
  renderer.setSize(innerWidth,innerHeight,false);
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize',onResize);
window.addEventListener('orientationchange',()=>setTimeout(()=>{onResize();needCalibrate=true;},300));
</script>
</body>
</html>
